version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cityeye_postgres
    restart: always
    environment:
      POSTGRES_USER: cityeye_user
      POSTGRES_PASSWORD: cityeye_password_2026
      POSTGRES_DB: cityeye_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cityeye_backend
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://cityeye_user:cityeye_password_2026@db:5432/cityeye_db
      - SECRET_KEY=cityeye_prod_jwt_secret_key_mumbai_2026
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cityeye_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
